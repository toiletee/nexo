<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NEXO</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000;
      --surface: #111113;
      --surface-2: #1c1c1e;
      --surface-3: #29292c;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --border: rgba(255,255,255,.08);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      outline: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.035), transparent 35%),
        #000;
    }

    header {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      padding: calc(env(safe-area-inset-top) + 16px) 20px 12px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 14px rgba(255,255,255,.6);
    }

    .logo {
      font-size: 18px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .status {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .settings-button {
      position: absolute;
      right: 14px;
      top: calc(env(safe-area-inset-top) + 9px);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 19px;
      transition: .2s ease;
    }

    .settings-button:active {
      background: rgba(255,255,255,.08);
      transform: scale(.92);
      color: #fff;
    }

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .chat::-webkit-scrollbar { display: none; }

    .welcome {
      margin: auto;
      width: min(100%, 340px);
      padding: 20px;
      text-align: center;
      animation: welcomeIn .6s ease;
    }

    .welcome-orb {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%,
        #fff 0%, #bcbcc0 18%, #4b4b50 43%, #171719 70%, #000 100%);
      box-shadow:
        0 0 35px rgba(255,255,255,.09),
        inset 0 0 20px rgba(255,255,255,.18);
      animation: breathe 4s ease-in-out infinite;
    }

    .welcome h1 {
      margin: 0 0 9px;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -.8px;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .message {
      max-width: 84%;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 16px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
      animation: messageIn .25s ease;
    }

    .user {
      align-self: flex-end;
      background: #f5f5f7;
      color: #000;
      border-bottom-right-radius: 6px;
    }

    .nexo {
      align-self: flex-start;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .typing {
      opacity: .65;
    }

    .input-area {
      flex-shrink: 0;
      padding: 8px 14px calc(env(safe-area-inset-bottom) + 12px);
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,.8) 22%);
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      padding: 6px 6px 6px 17px;
      border-radius: 28px;
      background: rgba(28,28,30,.92);
      border: 1px solid rgba(255,255,255,.07);
      box-shadow:
        0 8px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.025);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    input {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 16px;
    }

    input::placeholder { color: #77777c; }

    .send-button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #f5f5f7;
      color: #000;
      font-size: 19px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s ease, opacity .2s ease;
    }

    .send-button:active { transform: scale(.9); }
    .send-button:disabled { opacity: .45; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: flex-end;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .overlay.visible {
      display: flex;
      animation: fadeIn .2s ease;
    }

    .panel {
      width: 100%;
      max-height: 82dvh;
      overflow-y: auto;
      padding: 14px 18px calc(env(safe-area-inset-bottom) + 20px);
      background: rgba(22,22,24,.96);
      border-top: 1px solid rgba(255,255,255,.08);
      border-radius: 28px 28px 0 0;
      box-shadow: 0 -15px 50px rgba(0,0,0,.45);
      animation: panelUp .28s ease;
    }

    .panel-handle {
      width: 38px;
      height: 4px;
      margin: 0 auto 20px;
      border-radius: 10px;
      background: #4b4b4f;
    }

    .panel h2 {
      margin: 0;
      font-size: 23px;
      font-weight: 650;
    }

    .panel-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .memory-count {
      margin: 22px 0 10px;
      color: #77777c;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .7px;
      font-weight: 600;
    }

    .memory-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .memory-item {
      padding: 13px 14px;
      border-radius: 15px;
      background: #1c1c1e;
      border: 1px solid rgba(255,255,255,.055);
      color: #e9e9eb;
      font-size: 14px;
      line-height: 1.45;
    }

    .action {
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      border-radius: 15px;
      background: #252527;
      color: #fff;
      font-size: 15px;
      transition: transform .15s ease, background .2s ease;
    }

    .action:active { transform: scale(.98); }
    .action.primary { background: #f5f5f7; color: #000; font-weight: 600; }
    .action.danger { color: #ff453a; }
    .close { margin-top: 10px; background: transparent; color: var(--muted); }
    .file-input { display: none; }

    @keyframes breathe {
      0%,100% { transform: scale(1); opacity: .85; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes welcomeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes panelUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <div class="logo">NEXO</div>
    </div>
    <div class="status">Tu asistente personal</div>

    <button class="settings-button" id="settingsButton" aria-label="Memoria">
      ⚙︎
    </button>
  </header>

  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-orb"></div>
      <h1>Hola.</h1>
      <p>Soy NEXO.<br>Tu mano derecha digital.</p>
    </div>
  </main>

  <div class="input-area">
    <div class="input-box">
      <input
        id="messageInput"
        type="text"
        placeholder="Habla con NEXO..."
        autocomplete="off"
        enterkeyhint="send">
      <button class="send-button" id="sendButton" aria-label="Enviar">↑</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-handle"></div>
    <h2>Memoria</h2>
    <div class="panel-subtitle">
      Tus recuerdos se guardan localmente en este dispositivo.
    </div>

    <div class="memory-count" id="memoryCount">Cargando...</div>
    <div class="memory-list" id="memoryList"></div>

    <button class="action primary" id="exportButton">↑&nbsp; Exportar memoria</button>
    <button class="action" id="importButton">↓&nbsp; Importar memoria</button>

    <input class="file-input" id="fileInput" type="file" accept=".json,application/json">

    <button class="action danger" id="deleteAllButton">Borrar toda la memoria</button>
    <button class="action close" id="closeButton">Cerrar</button>
  </div>
</div>

<script>
  // ==============================
  // MEMORIA LOCAL
  // ==============================

  let database = null;

  const request = indexedDB.open("NEXO_Memory", 1);

  request.onupgradeneeded = function(event) {
    database = event.target.result;

    if (!database.objectStoreNames.contains("memories")) {
      const store = database.createObjectStore("memories", {
        keyPath: "id",
        autoIncrement: true
      });

      store.createIndex("content", "content", { unique: false });
      store.createIndex("createdAt", "createdAt", { unique: false });
    }
  };

  request.onsuccess = function(event) {
    database = event.target.result;
    console.log("NEXO: memoria local preparada.");
  };

  function saveMemory(content) {
    if (!database) return false;

    const transaction = database.transaction(["memories"], "readwrite");
    const store = transaction.objectStore("memories");

    store.add({
      content,
      createdAt: new Date().toISOString()
    });

    return true;
  }

  function getMemories(callback) {
    if (!database) {
      callback([]);
      return;
    }

    const transaction = database.transaction(["memories"], "readonly");
    const store = transaction.objectStore("memories");
    const req = store.getAll();

    req.onsuccess = function() {
      callback(req.result);
    };
  }

  function deleteMemories(searchText, callback) {
    getMemories(function(memories) {
      const transaction = database.transaction(["memories"], "readwrite");
      const store = transaction.objectStore("memories");
      const search = searchText.toLowerCase();
      let deleted = 0;

      memories.forEach(function(memory) {
        if (memory.content.toLowerCase().includes(search)) {
          store.delete(memory.id);
          deleted++;
        }
      });

      transaction.oncomplete = function() {
        callback(deleted);
      };
    });
  }

  function deleteAllMemories(callback) {
    const transaction = database.transaction(["memories"], "readwrite");
    const store = transaction.objectStore("memories");
    const req = store.clear();

    req.onsuccess = function() {
      callback();
    };
  }

  // ==============================
  // INTERFAZ
  // ==============================

  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");
  const overlay = document.getElementById("overlay");
  const memoryList = document.getElementById("memoryList");
  const memoryCount = document.getElementById("memoryCount");

  function addMessage(text, type) {
    if (welcome) welcome.style.display = "none";

    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;

    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;

    return message;
  }

  // ==============================
  // GEMINI
  // ==============================

  const NEXO_API_URL =
    "https://nexo-api.electricalmen2003.workers.dev/";

  async function askNexo(message) {
    const typing = addMessage("NEXO está pensando…", "nexo typing");

    try {
      sendButton.disabled = true;

      const response = await fetch(NEXO_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message
        })
      });

      const data = await response.json();

      typing.remove();

      if (!response.ok) {
        throw new Error(data.error || "Error del servidor");
      }

      addMessage(data.response, "nexo");

    } catch (error) {
      console.error("NEXO:", error);

      typing.remove();

      addMessage(
        "No he podido conectar con mi cerebro ahora mismo.",
        "nexo"
      );
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  }

  // ==============================
  // MENSAJES
  // ==============================

  function sendMessage() {
    const text = input.value.trim();

    if (!text || sendButton.disabled) return;

    addMessage(text, "user");
    input.value = "";

    processMessage(text);
  }

  function processMessage(text) {
    const lower = text.toLowerCase();

    // RECORDAR
    if (
      lower.startsWith("recuerda ") ||
      lower.startsWith("recuerda que ") ||
      lower.startsWith("nexo, recuerda ")
    ) {
      const memory = text
        .replace(/^nexo,\s*/i, "")
        .replace(/^recuerda que\s+/i, "")
        .replace(/^recuerda\s+/i, "")
        .trim();

      if (memory.length > 0) {
        if (saveMemory(memory)) {
          addMessage("Lo recordaré. 🧠", "nexo");
        } else {
          addMessage("No he podido guardar ese recuerdo.", "nexo");
        }
        return;
      }
    }

    // CONSULTAR MEMORIA
    if (
      lower.includes("qué recuerdas") ||
      lower.includes("que recuerdas")
    ) {
      getMemories(function(memories) {
        if (memories.length === 0) {
          addMessage(
            "Todavía no tengo ningún recuerdo guardado.",
            "nexo"
          );
          return;
        }

        let response = "Esto es lo que recuerdo:\n\n";

        memories.forEach(function(memory) {
          response += "• " + memory.content + "\n";
        });

        addMessage(response, "nexo");
      });

      return;
    }

    // OLVIDAR
    if (
      lower.startsWith("olvida ") ||
      lower.startsWith("olvida que ") ||
      lower.startsWith("nexo, olvida ")
    ) {
      const search = text
        .replace(/^nexo,\s*/i, "")
        .replace(/^olvida que\s+/i, "")
        .replace(/^olvida\s+/i, "")
        .trim();

      deleteMemories(search, function(deleted) {
        if (deleted > 0) {
          addMessage(
            "He eliminado " + deleted + " recuerdo(s). 🗑️",
            "nexo"
          );
        } else {
          addMessage(
            "No he encontrado ese recuerdo.",
            "nexo"
          );
        }
      });

      return;
    }

    // TODO LO DEMÁS -> GEMINI
    askNexo(text);
  }

  // ==============================
  // PANEL DE MEMORIA
  // ==============================

  function openMemoryPanel() {
    overlay.classList.add("visible");
    refreshMemoryPanel();
  }

  function refreshMemoryPanel() {
    getMemories(function(memories) {
      memoryCount.textContent =
        memories.length +
        (memories.length === 1 ? " recuerdo" : " recuerdos");

      memoryList.innerHTML = "";

      if (memories.length === 0) {
        const empty = document.createElement("div");
        empty.className = "memory-item";
        empty.textContent = "No tienes recuerdos guardados.";
        memoryList.appendChild(empty);
        return;
      }

      memories.forEach(function(memory) {
        const item = document.createElement("div");
        item.className = "memory-item";
        item.textContent = memory.content;
        memoryList.appendChild(item);
      });
    });
  }

  // ==============================
  // EXPORTAR
  // ==============================

  function exportMemory() {
    getMemories(function(memories) {
      const data = {
        app: "NEXO",
        version: 1,
        exportedAt: new Date().toISOString(),
        memories
      };

      const blob = new Blob(
        [JSON.stringify(data, null, 2)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download =
        "NEXO-memoria-" +
        new Date().toISOString().slice(0, 10) +
        ".json";

      link.click();
      URL.revokeObjectURL(url);
    });
  }

  // ==============================
  // IMPORTAR
  // ==============================

  function importMemory(file) {
    const reader = new FileReader();

    reader.onload = function(event) {
      try {
        const data = JSON.parse(event.target.result);

        if (!data.memories || !Array.isArray(data.memories)) {
          alert("Este archivo no parece una memoria de NEXO válida.");
          return;
        }

        const transaction =
          database.transaction(["memories"], "readwrite");

        const store = transaction.objectStore("memories");

        data.memories.forEach(function(memory) {
          if (typeof memory.content !== "string") return;

          store.add({
            content: memory.content,
            createdAt:
              memory.createdAt || new Date().toISOString()
          });
        });

        transaction.oncomplete = function() {
          alert("Memoria importada correctamente. 🧠");
          refreshMemoryPanel();
        };

      } catch (error) {
        alert("No se ha podido leer el archivo.");
      }
    };

    reader.readAsText(file);
  }

  // ==============================
  // EVENTOS
  // ==============================

  sendButton.addEventListener("click", sendMessage);

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });

  document
    .getElementById("settingsButton")
    .addEventListener("click", openMemoryPanel);

  document
    .getElementById("closeButton")
    .addEventListener("click", function() {
      overlay.classList.remove("visible");
    });

  overlay.addEventListener("click", function(event) {
    if (event.target === overlay) {
      overlay.classList.remove("visible");
    }
  });

  document
    .getElementById("exportButton")
    .addEventListener("click", exportMemory);

  document
    .getElementById("importButton")
    .addEventListener("click", function() {
      document.getElementById("fileInput").click();
    });

  document
    .getElementById("fileInput")
    .addEventListener("change", function(event) {
      const file = event.target.files[0];

      if (file) {
        importMemory(file);
      }

      event.target.value = "";
    });

  document
    .getElementById("deleteAllButton")
    .addEventListener("click", function() {
      const confirmed = confirm(
        "¿Seguro que quieres borrar TODA la memoria de NEXO? Esta acción no se puede deshacer."
      );

      if (!confirmed) return;

      deleteAllMemories(function() {
        alert("Toda la memoria ha sido eliminada.");
        refreshMemoryPanel();
      });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <title>NEXO</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: calc(env(safe-area-inset-top) + 18px) 20px 12px;
      text-align: center;
      flex-shrink: 0;
      position: relative;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .status {
      margin-top: 5px;
      font-size: 13px;
      color: #8e8e93;
    }

    .settings-button {
      position: absolute;
      right: 16px;
      top: calc(env(safe-area-inset-top) + 14px);
      width: 40px;
      height: 40px;
      background: transparent;
      color: #8e8e93;
      font-size: 22px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 320px;
    }

    .welcome h1 {
      font-size: 30px;
      margin: 0 0 10px;
    }

    .welcome p {
      font-size: 16px;
      color: #8e8e93;
      line-height: 1.5;
      margin: 0;
    }

    .message {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 19px;
      font-size: 16px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #fff;
      color: #000;
      border-bottom-right-radius: 5px;
    }

    .nexo {
      align-self: flex-start;
      background: #1c1c1e;
      color: #fff;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      padding: 10px 16px calc(env(safe-area-inset-bottom) + 14px);
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1c1c1e;
      border-radius: 25px;
      padding: 7px 8px 7px 16px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
    }

    input::placeholder {
      color: #8e8e93;
    }

    .send-button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 18px;
    }

    button:active {
      transform: scale(0.94);
    }

    /* PANEL DE MEMORIA */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(12px);
      display: none;
      align-items: flex-end;
      z-index: 10;
    }

    .overlay.visible {
      display: flex;
    }

    .panel {
      width: 100%;
      background: #1c1c1e;
      border-radius: 25px 25px 0 0;
      padding: 22px 20px calc(env(safe-area-inset-bottom) + 22px);
      max-height: 80vh;
      overflow-y: auto;
    }

    .panel h2 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    .panel-subtitle {
      color: #8e8e93;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .memory-count {
      color: #8e8e93;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .memory-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .memory-item {
      background: #2c2c2e;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.4;
    }

    .action {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      margin-top: 8px;
      background: #2c2c2e;
      color: #fff;
      font-size: 16px;
    }

    .action.primary {
      background: #fff;
      color: #000;
    }

    .action.danger {
      color: #ff453a;
    }

    .close {
      margin-top: 15px;
      background: transparent;
      color: #8e8e93;
    }

    .file-input {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">NEXO</div>
    <div class="status">Tu asistente personal</div>

    <button
      class="settings-button"
      id="settingsButton"
      aria-label="Configuración">
      ⚙︎
    </button>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>Hola.</h1>
      <p>
        Soy NEXO.<br>
        Tu mano derecha digital.
      </p>
    </div>

  </main>

  <div class="input-area">

    <div class="input-box">

      <input
        id="messageInput"
        type="text"
        placeholder="Habla con NEXO..."
        autocomplete="off"
        enterkeyhint="send">

      <button
        class="send-button"
        id="sendButton"
        aria-label="Enviar">
        ↑
      </button>

    </div>

  </div>

</div>


<!-- PANEL DE MEMORIA -->

<div class="overlay" id="overlay">

  <div class="panel">

    <h2>Memoria</h2>

    <div class="panel-subtitle">
      Los recuerdos están guardados localmente en este dispositivo.
    </div>

    <div class="memory-count" id="memoryCount">
      Cargando...
    </div>

    <div class="memory-list" id="memoryList"></div>

    <button class="action primary" id="exportButton">
      ↑ Exportar memoria
    </button>

    <button class="action" id="importButton">
      ↓ Importar memoria
    </button>

    <input
      class="file-input"
      id="fileInput"
      type="file"
      accept=".json,application/json">

    <button class="action danger" id="deleteAllButton">
      Borrar toda la memoria
    </button>

    <button class="action close" id="closeButton">
      Cerrar
    </button>

  </div>

</div>


<script>

  // ==========================================
  // BASE DE DATOS LOCAL
  // ==========================================

  let database;

  const request = indexedDB.open("NEXO_Memory", 1);

  request.onupgradeneeded = function(event) {

    database = event.target.result;

    if (!database.objectStoreNames.contains("memories")) {

      const store = database.createObjectStore(
        "memories",
        {
          keyPath: "id",
          autoIncrement: true
        }
      );

      store.createIndex("content", "content", {
        unique: false
      });

      store.createIndex("createdAt", "createdAt", {
        unique: false
      });
    }
  };

  request.onsuccess = function(event) {

    database = event.target.result;

    console.log("NEXO: memoria local preparada.");
  };


  // ==========================================
  // GUARDAR
  // ==========================================

  function saveMemory(content) {

    if (!database) return false;

    const transaction =
      database.transaction(["memories"], "readwrite");

    const store =
      transaction.objectStore("memories");

    store.add({
      content: content,
      createdAt: new Date().toISOString()
    });

    return true;
  }


  // ==========================================
  // OBTENER
  // ==========================================

  function getMemories(callback) {

    if (!database) {
      callback([]);
      return;
    }

    const transaction =
      database.transaction(["memories"], "readonly");

    const store =
      transaction.objectStore("memories");

    const request =
      store.getAll();

    request.onsuccess = function() {
      callback(request.result);
    };
  }


  // ==========================================
  // BORRAR UNO
  // ==========================================

  function deleteMemories(searchText, callback) {

    getMemories(function(memories) {

      const transaction =
        database.transaction(["memories"], "readwrite");

      const store =
        transaction.objectStore("memories");

      let deleted = 0;

      const search =
        searchText.toLowerCase();

      memories.forEach(function(memory) {

        if (
          memory.content
            .toLowerCase()
            .includes(search)
        ) {

          store.delete(memory.id);
          deleted++;
        }

      });

      transaction.oncomplete = function() {
        callback(deleted);
      };

    });
  }


  // ==========================================
  // BORRAR TODO
  // ==========================================

  function deleteAllMemories(callback) {

    const transaction =
      database.transaction(["memories"], "readwrite");

    const store =
      transaction.objectStore("memories");

    const request =
      store.clear();

    request.onsuccess = function() {
      callback();
    };
  }


  // ==========================================
  // INTERFAZ
  // ==========================================

  const input =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const chat =
    document.getElementById("chat");

  const welcome =
    document.getElementById("welcome");

  const overlay =
    document.getElementById("overlay");

  const memoryList =
    document.getElementById("memoryList");

  const memoryCount =
    document.getElementById("memoryCount");


  function addMessage(text, type) {

    if (welcome) {
      welcome.style.display = "none";
    }

    const message =
      document.createElement("div");

    message.className =
      "message " + type;

    message.textContent =
      text;

    chat.appendChild(message);

    chat.scrollTop =
      chat.scrollHeight;
  }


  // ==========================================
  // PROCESAR MENSAJES
  // ==========================================

  function sendMessage() {

    const text =
      input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    processMessage(text);
  }


  function processMessage(text) {

    const lower =
      text.toLowerCase();


    // RECORDAR

    if (
      lower.startsWith("recuerda ") ||
      lower.startsWith("recuerda que ") ||
      lower.startsWith("nexo, recuerda ")
    ) {

      let memory =
        text
          .replace(/^nexo,\s*/i, "")
          .replace(/^recuerda que\s+/i, "")
          .replace(/^recuerda\s+/i, "")
          .trim();

      if (memory.length > 0) {

        if (saveMemory(memory)) {

          addMessage(
            "Lo recordaré. 🧠",
            "nexo"
          );

        } else {

          addMessage(
            "No he podido guardar ese recuerdo.",
            "nexo"
          );
        }

        return;
      }
    }


    // CONSULTAR

    if (
      lower.includes("qué recuerdas") ||
      lower.includes("que recuerdas")
    ) {

      getMemories(function(memories) {

        if (memories.length === 0) {

          addMessage(
            "Todavía no tengo ningún recuerdo guardado.",
            "nexo"
          );

          return;
        }

        let response =
          "Esto es lo que recuerdo:\n\n";

        memories.forEach(function(memory) {

          response +=
            "• " +
            memory.content +
            "\n";
        });

        addMessage(
          response,
          "nexo"
        );

      });

      return;
    }


    // OLVIDAR

    if (
      lower.startsWith("olvida ") ||
      lower.startsWith("olvida que ") ||
      lower.startsWith("nexo, olvida ")
    ) {

      let search =
        text
          .replace(/^nexo,\s*/i, "")
          .replace(/^olvida que\s+/i, "")
          .replace(/^olvida\s+/i, "")
          .trim();

      deleteMemories(
        search,
        function(deleted) {

          if (deleted > 0) {

            addMessage(
              "He eliminado " +
              deleted +
              " recuerdo(s). 🗑️",
              "nexo"
            );

          } else {

            addMessage(
              "No he encontrado ese recuerdo.",
              "nexo"
            );
          }
        }
      );

      return;
    }


    // RESPUESTA PROVISIONAL

    setTimeout(function() {

      addMessage(
        "Te escucho. Mi cerebro todavía está en construcción 🧠",
        "nexo"
      );

    }, 400);

  }


  // ==========================================
  // PANEL DE MEMORIA
  // ==========================================

  function openMemoryPanel() {

    overlay.classList.add("visible");

    refreshMemoryPanel();
  }


  function refreshMemoryPanel() {

    getMemories(function(memories) {

      memoryCount.textContent =
        memories.length +
        (
          memories.length === 1
            ? " recuerdo"
            : " recuerdos"
        );

      memoryList.innerHTML = "";

      if (memories.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "memory-item";

        empty.textContent =
          "No tienes recuerdos guardados.";

        memoryList.appendChild(empty);

        return;
      }

      memories.forEach(function(memory) {

        const item =
          document.createElement("div");

        item.className =
          "memory-item";

        item.textContent =
          memory.content;

        memoryList.appendChild(item);

      });

    });
  }


  // ==========================================
  // EXPORTAR
  // ==========================================

  function exportMemory() {

    getMemories(function(memories) {

      const data = {
        app: "NEXO",
        version: 1,
        exportedAt: new Date().toISOString(),
        memories: memories
      };

      const json =
        JSON.stringify(
          data,
          null,
          2
        );

      const blob =
        new Blob(
          [json],
          {
            type: "application/json"
          }
        );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "NEXO-memoria-" +
        new Date()
          .toISOString()
          .slice(0, 10) +
        ".json";

      link.click();

      URL.revokeObjectURL(url);

    });
  }


  // ==========================================
  // IMPORTAR
  // ==========================================

  function importMemory(file) {

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        try {

          const data =
            JSON.parse(
              event.target.result
            );

          if (
            !data.memories ||
            !Array.isArray(data.memories)
          ) {

            alert(
              "Este archivo no parece una memoria de NEXO válida."
            );

            return;
          }

          const transaction =
            database.transaction(
              ["memories"],
              "readwrite"
            );

          const store =
            transaction.objectStore(
              "memories"
            );

          data.memories.forEach(function(memory) {

            store.add({
              content:
                memory.content,

              createdAt:
                memory.createdAt ||
                new Date().toISOString()
            });

          });

          transaction.oncomplete =
            function() {

              alert(
                "Memoria importada correctamente. 🧠"
              );

              refreshMemoryPanel();
            };

        } catch (error) {

          alert(
            "No se ha podido leer el archivo."
          );

        }

      };

    reader.readAsText(file);
  }


  // ==========================================
  // EVENTOS
  // ==========================================

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  input.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );


  document
    .getElementById("settingsButton")
    .addEventListener(
      "click",
      openMemoryPanel
    );


  document
    .getElementById("closeButton")
    .addEventListener(
      "click",
      function() {

        overlay.classList.remove(
          "visible"
        );

      }
    );


  document
    .getElementById("exportButton")
    .addEventListener(
      "click",
      exportMemory
    );


  document
    .getElementById("importButton")
    .addEventListener(
      "click",
      function() {

        document
          .getElementById("fileInput")
          .click();

      }
    );


  document
    .getElementById("fileInput")
    .addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];

        if (file) {
          importMemory(file);
        }

        event.target.value = "";

      }
    );


  document
    .getElementById("deleteAllButton")
    .addEventListener(
      "click",
      function() {

        const confirmed =
          confirm(
            "¿Seguro que quieres borrar TODA la memoria de NEXO? Esta acción no se puede deshacer."
          );

        if (!confirmed) return;

        deleteAllMemories(
          function() {

            alert(
              "Toda la memoria ha sido eliminada."
            );

            refreshMemoryPanel();

          }
        );

      }
    );

</script>

</body>
</html>

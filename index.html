<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>NEXO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 20px 12px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .status {
      margin-top: 5px;
      font-size: 13px;
      opacity: 0.5;
    }

    .chat {
      flex: 1;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome {
      text-align: center;
      max-width: 320px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      font-size: 16px;
      opacity: 0.6;
      line-height: 1.5;
    }

    .input-area {
      padding: 12px 16px 25px;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1c1c1e;
      border-radius: 24px;
      padding: 8px 10px 8px 16px;
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
    }

    button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 19px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">NEXO</div>
      <div class="status">Tu asistente personal</div>
    </header>

    <main class="chat">
      <div class="welcome">
        <h1>Hola.</h1>
        <p>
          Soy NEXO.<br>
          Tu mano derecha digital.
        </p>
      </div>
    </main>

    <div class="input-area">
      <div class="input-box">
        <input
          type="text"
          placeholder="Habla con NEXO..."
          autocomplete="off"
        >

        <button title="Hablar">🎙️</button>
      </div>
    </div>

  </div>

</body>
</html>

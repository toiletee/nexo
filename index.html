<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <title>NEXO</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: calc(env(safe-area-inset-top) + 18px) 20px 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .status {
      margin-top: 5px;
      font-size: 13px;
      color: #8e8e93;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 320px;
      transition: opacity 0.2s;
    }

    .welcome h1 {
      font-size: 30px;
      margin: 0 0 10px;
    }

    .welcome p {
      font-size: 16px;
      color: #8e8e93;
      line-height: 1.5;
      margin: 0;
    }

    .message {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 19px;
      font-size: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #fff;
      color: #000;
      border-bottom-right-radius: 5px;
    }

    .nexo {
      align-self: flex-start;
      background: #1c1c1e;
      color: #fff;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      padding: 10px 16px calc(env(safe-area-inset-bottom) + 14px);
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1c1c1e;
      border-radius: 25px;
      padding: 7px 8px 7px 16px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
    }

    input::placeholder {
      color: #8e8e93;
    }

    button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 18px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.94);
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">NEXO</div>
    <div class="status">Tu asistente personal</div>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>Hola.</h1>
      <p>
        Soy NEXO.<br>
        Tu mano derecha digital.
      </p>
    </div>

  </main>

  <div class="input-area">

    <div class="input-box">

      <input
        id="messageInput"
        type="text"
        placeholder="Habla con NEXO..."
        autocomplete="off"
        enterkeyhint="send"
      >

      <button id="sendButton" aria-label="Enviar">
        ↑
      </button>

    </div>

  </div>

</div>

<script>

  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  function addMessage(text, type) {

    if (welcome) {
      welcome.style.display = "none";
    }

    const message = document.createElement("div");

    message.className = "message " + type;
    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }

  function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    /*
      NEXO todavía no tiene cerebro.
      Esta respuesta es solamente temporal.
    */

    setTimeout(() => {

      addMessage(
        "Te escucho. Mi cerebro todavía está en construcción 🧠",
        "nexo"
      );

    }, 400);
  }

  sendButton.addEventListener("click", sendMessage);

  input.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {
      sendMessage();
    }

  });

</script>

</body>
</html>
